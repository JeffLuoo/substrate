apiVersion: v1
kind: Namespace
metadata:
  name: otel-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opentelemetry-collector-config
  namespace: otel-system
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:

      # The count connector below sends deltas, and the Prometheus exporter
      # reads the new start timestamp of each batch as a reset. Without
      # deltatocumulative the counts do not accumulate and each scrape shows
      # only the last batch.
      deltatocumulative:

      # The count connector reads the attributes of a span or a datapoint,
      # and not the attributes of the resource, thus service.name is not
      # visible to it. Copy service.name to an attribute of the item. Without
      # the copy the connector has nothing to group by and counts every
      # service into one bucket.
      #
      # The name is svc, and not job, because Prometheus sets job to the name
      # of the scrape job.
      transform/svc:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - set(attributes["svc"], resource.attributes["service.name"])
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["svc"], resource.attributes["service.name"])

    # The volume of telemetry for each service, the same two counts that
    # benchmarking/telemetry/meter.yaml gives on GKE. On GKE the managed
    # collector cannot hold a connector, thus a measurement there needs a
    # second collector in front of it. Here the collector is ours, thus the
    # counts belong in it and kind needs no meter.
    connectors:
      count:
        spans:
          substrate_spans:
            description: Spans received, by emitting service.
            attributes:
              # Without a default value the connector removes each item that
              # has no service.name from the count. The item does not show as
              # unknown, and the totals are too low with no error message.
              - key: svc
                default_value: unknown
        datapoints:
          substrate_datapoints:
            description: Metric datapoints received, by emitting service.
            attributes:
              - key: svc
                default_value: unknown

    exporters:
      otlp/jaeger:
        endpoint: jaeger.otel-system.svc.cluster.local:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/jaeger, debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus, debug]

        # The count pipelines read the same receiver as the two pipelines
        # above. The collector gives each pipeline its own copy, and it clones
        # the data because transform/svc changes it. Thus the svc attribute
        # that the count needs does not reach Jaeger.
        traces/count:
          receivers: [otlp]
          processors: [transform/svc]
          exporters: [count]
        metrics/count:
          receivers: [otlp]
          processors: [transform/svc]
          exporters: [count]
        metrics/counts:
          receivers: [count]
          processors: [deltatocumulative]
          exporters: [prometheus]

      # The otelcol_* counters of the collector itself. A service that reports
      # zero volume gives no data by itself: otelcol_receiver_accepted_* shows
      # the difference between a service that sent nothing and data that never
      # arrived. The default reader binds to localhost, thus give the address
      # of each interface so the Prometheus pod can reach it.
      telemetry:
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-collector
  namespace: otel-system
  labels:
    app: opentelemetry-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opentelemetry-collector
  template:
    metadata:
      labels:
        app: opentelemetry-collector
      annotations:
        # The substrate_* counts, on the port of the Prometheus exporter. The
        # otelcol_* counters are on 8888; the annotation can name one port
        # only, thus a scrape job in prometheus.yaml collects that one.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8889"
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.157.0@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6
        args:
        - --config=/conf/otel-collector-config.yaml
        volumeMounts:
        - name: config
          mountPath: /conf
        ports:
        - name: otlp-grpc
          containerPort: 4317
        - name: otlp-http
          containerPort: 4318
        - name: prom
          containerPort: 8889
        - name: self
          containerPort: 8888
      volumes:
      - name: config
        configMap:
          name: opentelemetry-collector-config
          items:
          - key: otel-collector-config.yaml
            path: otel-collector-config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-collector
  namespace: otel-system
spec:
  type: ClusterIP
  selector:
    app: opentelemetry-collector
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318
  - name: prom
    port: 8889
    targetPort: 8889
  - name: self
    port: 8888
    targetPort: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: otel-system
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.55@sha256:f6b5d09073f14f76873d300f565a6691d815e81bea8e07e1dc3ff67e0596dd4e
        ports:
        - name: otlp-grpc
          containerPort: 4317
        - name: otlp-http
          containerPort: 4318
        - name: query
          containerPort: 16686
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: otel-system
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318
  - name: query
    port: 16686
    targetPort: 16686
